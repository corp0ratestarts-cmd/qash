[meta]
version = "1.0.0"
lock_algorithm = "SHA3-256"
genesis_status = "provisional"
deployment_authoritative = false
artifact_manifest = "spec/genesis-artifacts.txt"
deployment_model = "one-shot"
governance = "zero"
genesis_hash = "SHA3-256:7717c6d299e5df790debb94eba3c2acc64f0c6ec128a8c8d5ab8fb63f2320295"

[fixed_point]
scale = 1_000_000
intermediate_width = 128
rounding_mode = "floor_toward_neg_inf"
overflow_policy = "absorbing_halt"

[lyapunov]
weight_divergence_D = 400_000
weight_conflict_C = 350_000
weight_slash_Sigma = 250_000
epsilon_threshold = 20_000
evaluation_window = 3
max_queries_per_epoch = 1_000_000

[epoch.timing]
duration_ms = 500
max_control_loop_latency_ms = 450
sync_tolerance_ms = 50
epoch_counter_seed = "0xQASH_EPOCH_PRNG_SEED_2026"

[obfuscation]
method = "concatenation_injective"
leaf_index_bytes = 48
sparse_merkle_depth = 384
hash_cascade = ["SHA3-256", "BLAKE3", "KangarooTwelve"]

[hardware]
authorized_platforms = [
  "x86_64_avx2", "aarch64_neon", "riscv64_vector",
  "loongarch_loongson", "arm_loongson", "vliw_elbrus",
  "itron_renesas_rx", "itron_renesas_rl78", "itron_arm_cortex_m",
  "esp32_s3", "snapdragon_arm64", "apple_silicon_arm64"
]
attestation_modes = ["tpm_2_0", "trustzone", "secure_enclave", "software_hash_merkle"]
require_hardware_tee = false

[consensus.receipts]
include_in_state_root = false

[clone_protocol]
enabled = true
version = "v1.2"
channels = ["QR_code", "NFC", "BLE", "WiFi_Direct", "LoRa", "Ultrasonic"]
petn_crcs_integration = "BLE_only"
qr_mode = "chunked_self_authenticated"
nfc_mode = "direct_apdu"
ble_mode = "dual"                     # "dual" = concurrent peripheral + central roles
ultrasonic_mode = "fsk_24khz"         # FSK at 24 kHz carrier; inaudible to humans
max_offline_epochs = 12
store_and_forward = true              # relay nodes buffer chunks for absent peers
cover_traffic = true                  # constant-rate dummy emissions for timing obfuscation
packet_compression = "LZ4"           # applied to clone-chunk payloads before signing
bloom_filter_dedup = true             # Bloom filter prevents redundant chunk relay
emergency_wipe_signal = true          # validator may broadcast signed wipe command

[crypto.cascade]
primary_signature = "Dilithium5"
anchor_signature = "SLH-DSA-SHA3-256"
fallback_signature = "Falcon-512"
hash_primitives = ["SHA3-256", "BLAKE3", "KangarooTwelve", "SM3", "Streebog"]
pqc_agility_epoch = 10000

[validation]
interval_precision_digits = 12
gershgorin_precheck = true
symmetry_enforcement = "strict"
cross_isa_determinism_required = true
