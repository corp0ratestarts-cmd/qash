[meta]
version = "1.1.0"
lock_algorithm = "QASH-CASCADE-7"
deployment_model = "one-shot"
governance = "zero"
genesis_blind_nonce = "SHA3-256:QASH:GENESIS:BLIND:v1.1:a40f9a061579b263a522c6702aa6bf16ca0e03e0b6779b0f71ada2cb223f27e2"
genesis_hash = "QASH-CASCADE-7:63be85c25adf68f0f2376a51b711b0f3890cfabb89d92108191689853a77867cd365c8db7bbe41506ca1872c5eecaf5186a0b9c8466ca0fcd23179ae87f95a23"

[fixed_point]
scale = 1_000_000
intermediate_width = 128
rounding_mode = "floor_toward_neg_inf"
overflow_policy = "absorbing_halt"

[lyapunov]
weight_divergence_D = 350_000
weight_conflict_C = 300_000
weight_slash_Sigma = 200_000
weight_cascade_health_CH = 150_000
epsilon_threshold = 20_000
evaluation_window = 3
max_queries_per_epoch = 1_000_000
# PHI_MAX_SAFE = N_max × floor(γ_raw × i64::MAX / p) / 2
# = 1024 × floor(200_000 × 9_223_372_036_854_775_807 / 1_000_000) / 2
phi_max_safe = 944473296573929042432

[epoch.timing]
duration_ms = 500
max_control_loop_latency_ms = 450
sync_tolerance_ms = 50
epoch_counter_seed = "0xQASH_EPOCH_PRNG_SEED_2026"

[obfuscation]
method = "cascade_derived_injective"
leaf_index_bytes = 48
sparse_merkle_depth = 384

[hardware]
authorized_platforms = [
  "x86_64_avx2", "aarch64_neon", "riscv64_vector",
  "loongarch_loongson", "arm_loongson", "vliw_elbrus",
  "itron_renesas_rx", "itron_renesas_rl78", "itron_arm_cortex_m",
  "esp32_s3", "snapdragon_arm64", "apple_silicon_arm64"
]
attestation_modes = ["tpm_2_0", "trustzone", "secure_enclave", "software_hash_merkle"]
require_hardware_tee = false

[consensus.receipts]
include_in_state_root = false

[clone_protocol]
enabled = true
version = "v1.2"
channels = ["QR_code", "NFC", "BLE"]
petn_crcs_integration = "BLE_only"
qr_mode = "chunked_self_authenticated"
nfc_mode = "direct_apdu"
max_offline_hops = 7
max_offline_epochs = 12
chunk_verification_mode = "cascade_bound"

[crypto.cascade]
primary_signature = "Dilithium5"
anchor_signature = "SLH-DSA-SHA3-256"
fallback_signature = "Falcon-512"
kem_primary = "ML-KEM-768"
hash_primitives = ["SHA3-256", "BLAKE3", "KangarooTwelve", "SM3", "Streebog"]
pqc_agility_epoch = 10000
cascade_depth = 7
cascade_composition_mode = "recursive_binding"
binding_primitive = "SHA3-512"
domain_separators = [
  "QASH:CASCADE:L1:PARALLEL",
  "QASH:CASCADE:L2:BIND",
  "QASH:CASCADE:L3:EXPAND",
  "QASH:CASCADE:L4:EXPAND",
  "QASH:CASCADE:L5:EXPAND",
  "QASH:CASCADE:L6:EXPAND",
  "QASH:CASCADE:L7:FINALIZE",
]
cascade_verification_required = true
cascade_proof_inclusion = "sparse_merkle"

[crypto.cascade.rotation_schedule]
epoch_0     = "Dilithium5"
epoch_10000 = "ML-DSA-87"
epoch_20000 = "SLH-DSA-SHA3-256"
epoch_30000 = "Falcon-512"
epoch_40000 = "TERMINAL_HALT"

[migration.compatibility]
accept_v1_0_validators = true
migration_window_epochs = 100
v1_0_validator_cascade_mode = "parallel_only"
post_migration_enforcement = "cascade_required"
state_conversion_proof_required = true

[validation]
interval_precision_digits = 12
gershgorin_precheck = true
symmetry_enforcement = "strict"
cross_isa_determinism_required = true
