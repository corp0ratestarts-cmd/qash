[meta]
version = "1.0.0"
lock_algorithm = "QASH-CASCADE-7"
genesis_status = "provisional"
deployment_authoritative = false
artifact_manifest = "spec/genesis-artifacts.txt"
deployment_model = "one-shot"
governance = "zero"
genesis_hash = "QASH-CASCADE-7:4f4606fe57cb4fcf1cacf73275423fe0873a13a27a03a6ffc6f9a9ab021c70c2d60ef2013c226b16e3c128378823388997ffa83b1ca897e7518d46de905c1e44"

[fixed_point]
scale = 1_000_000
intermediate_width = 128
rounding_mode = "floor_toward_neg_inf"
overflow_policy = "absorbing_halt"

[lyapunov]
weight_divergence_D = 400_000
weight_conflict_C = 350_000
weight_slash_Sigma = 250_000
epsilon_threshold = 20_000
phi_max_safe = 500_000_000
evaluation_window = 3
max_queries_per_epoch = 1_000_000

[epoch.timing]
duration_ms = 500
max_control_loop_latency_ms = 450
sync_tolerance_ms = 50
epoch_counter_seed = "0xQASH_EPOCH_PRNG_SEED_2026"
epoch_skew_bound = 1     # Δ: max future epochs to accept

[obfuscation]
method = "concatenation_injective"
leaf_index_bytes = 48
sparse_merkle_depth = 384
hash_cascade = ["SHA3-256", "BLAKE3", "KangarooTwelve"]

[hardware]
authorized_platforms = [
  "x86_64_avx2", "aarch64_neon", "riscv64_vector",
  "loongarch_loongson", "arm_loongson", "vliw_elbrus",
  "itron_renesas_rx", "itron_renesas_rl78", "itron_arm_cortex_m",
  "esp32_s3", "snapdragon_arm64", "apple_silicon_arm64"
]
attestation_modes = ["tpm_2_0", "trustzone", "secure_enclave", "software_hash_merkle"]
require_hardware_tee = false

[consensus.receipts]
include_in_state_root = false

[clone_protocol]
enabled = true
version = "v1.2"
channels = ["QR_code", "NFC", "BLE", "WiFi_Direct", "LoRa", "Ultrasonic"]
petn_crcs_integration = "BLE_only"
qr_mode = "chunked_self_authenticated"
nfc_mode = "direct_apdu"
ble_mode = "dual"                     # "dual" = concurrent peripheral + central roles
ultrasonic_mode = "fsk_24khz"         # FSK at 24 kHz carrier; inaudible to humans
max_offline_epochs = 12
store_and_forward = true              # relay nodes buffer chunks for absent peers
cover_traffic = true                  # constant-rate dummy emissions for timing obfuscation
packet_compression = "LZ4"           # applied to clone-chunk payloads before signing
bloom_filter_dedup = true             # Bloom filter prevents redundant chunk relay
emergency_wipe_signal = true          # validator may broadcast signed wipe command

[crypto.cascade]
primary_signature = "Dilithium5"
anchor_signature = "SLH-DSA-SHA3-256"
fallback_signature = "Falcon-512"
hash_primitives = [
  "SHA3-512", "BLAKE3-XOF-64", "KangarooTwelve-XOF-64",
  "SM3-double-width", "Streebog-512", "Kupyna-512", "LSH-512"
]
pqc_agility_epoch = 10000

[crypto.transport]
kem           = "X-Wing"
xwing_label   = "\\.//^\\XWingDraftCombiner09"
classical_kem = "X25519"
pqc_kem       = "ML-KEM-768"
hash_combiner = "SHA3-256"

[validation]
interval_precision_digits = 12
gershgorin_precheck = true
symmetry_enforcement = "strict"
cross_isa_determinism_required = true

# ---------------------------------------------------------------------------
# v1.1 additions (append-only; modifying existing fields defines a new network)
# ---------------------------------------------------------------------------

[cascade.health]
# CASCADE_DEPTH: max consecutive fully-idle epochs before cascade_health saturates.
# Wire format: cascade_health:u32 committed in FULL_STATE_FIXED_BYTES (v1.1 = 120).
depth = 8
health_threshold = 8
# Epochs before v1.0 envelopes are rejected by version gating (item 2-F).
compatibility_window = 100
# cascade_health_factor: weight in Lyapunov extension (reserved; not yet active in v1.1.0).
cascade_health_factor = 50_000

[epoch.skew]
# SKEW_BOUND: max future epochs an envelope may claim (validate_envelope_epoch).
epoch_skew_bound = 1

[protocol.versioning]
# Wire protocol version constants.
version_v1_0 = 0x1000
version_v1_1 = 0x1100
# Floor version below which envelopes are rejected after compatibility_window expires.
compat_version_floor = 0x1000

# ---------------------------------------------------------------------------
# GRC-7-7-v2 Genesis Ratchet Certificate (append-only)
# ---------------------------------------------------------------------------

[genesis.certificate]
algorithm = "QASH-GRC-7-7-v2"
# artifact_identity_root == genesis_hash (QASH-CASCADE-7 output); see [meta].
work_root = "ARGON2ID:860ca3fed225dcf6d5a2c54c29e8d83eb64c1c3f9649ef6b54c7f350c7c62ac003b7683bab9010c2b3e6be1cf93f640af06396c3f13efe32b5c141e89c22164b"

[genesis.work]
algorithm = "Argon2id"
memory_mib = 512
time_cost = 3
parallelism = 1
output_bytes = 64
salt_algorithm = "SHA3-512"
salt_inputs = ["QASH:GRC:PROVISIONAL:ENTROPY", "genesis_hash_bytes"]
salt_status = "provisional"
# At lock time: salt = full 64-byte SHA3-512(locked_public_entropy || genesis_hash_bytes)

[genesis.long_work]
enabled = false
profile = "archival-only"
# Optional ESR profile; not required for normal verification.

[genesis.hedge_policy]
total_roots = 7
verification_rule = "all_7_roots_must_match"
security_model = "last_unbroken_root"
retirement_allowed = false
deprecation_status_is_informational = true

