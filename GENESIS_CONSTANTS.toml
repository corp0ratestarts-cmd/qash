[meta]
version = "1.0.0"
lock_algorithm = "SHA3-256"
genesis_status = "provisional"
deployment_authoritative = false
artifact_manifest = "spec/genesis-artifacts.txt"
deployment_model = "one-shot"
governance = "zero"
genesis_hash = "SHA3-256:cd588cf5821d400f93bbbf27899e952e10b37a83a8ede9e6c16e202da40def64"

[fixed_point]
scale = 1_000_000
intermediate_width = 128
rounding_mode = "floor_toward_neg_inf"
overflow_policy = "absorbing_halt"

[lyapunov]
weight_divergence_D = 400_000
weight_conflict_C = 350_000
weight_slash_Sigma = 250_000
epsilon_threshold = 20_000
phi_max_safe = 500_000_000
evaluation_window = 3
max_queries_per_epoch = 1_000_000

[epoch.timing]
# SIMULATION-ONLY: These timing constants are calibrated for local simulation
# and automated test environments. They are NOT suitable for production network
# deployment without network-condition profiling and evidence-backed tuning.
# A production deployment MUST replace these with values derived from measured
# round-trip latency, validator geographic distribution, and clock-sync accuracy.
# Represented timing budget: 500ms epoch, 450ms control loop, 50ms sync slack.
# Deployment parameter tier: see docs/spec/00_execution_model.md §4.
timing_status = "simulation"
duration_ms = 500
max_control_loop_latency_ms = 450
sync_tolerance_ms = 50
epoch_counter_seed = "0xQASH_EPOCH_PRNG_SEED_2026"

[obfuscation]
method = "concatenation_injective"
leaf_index_bytes = 48
sparse_merkle_depth = 384
hash_cascade = ["SHA3-256", "BLAKE3", "KangarooTwelve"]

[hardware]
# Only platforms with Rust tier-1/2 support and CI-verified determinism.
# Removed fictional/unsupported targets (Elbrus VLIW, arm_loongson, ITRON).
authorized_platforms = [
  "x86_64_avx2", "aarch64_neon", "riscv64_vector"
]
attestation_modes = ["tpm_2_0", "trustzone", "secure_enclave", "software_hash_merkle"]
require_hardware_tee = false

[consensus.receipts]
# include_in_state_root = false applies ONLY during pre-v1.2 (when receipt_root
# and efb_root are both zero). Once sharding activates, the code in transition.rs
# automatically includes them when non-zero (see lines 461-463).
# M2 formal proof that zero-exclusion preserves replay-determinism:
#   proofs/sharding/receipt_exclusion_determinism.v (RE-1..RE-4)
include_in_state_root = false

# [clone_protocol] section removed. Clone protocol belongs in a spec document,
# not in immutable genesis constants. Emergency wipe signals, cover traffic,
# and unimplemented channel transports (LoRa, Ultrasonic) are excluded by design:
# a signed network-wide wipe with no formal proof obligation and no implementing code
# has no place in a zero-governance deterministic consensus protocol.

[crypto.cascade]
primary_signature = "Dilithium5"
anchor_signature = "SLH-DSA-SHA3-256"
fallback_signature = "Falcon-512"
hash_primitives = ["SHA3-256", "BLAKE3", "KangarooTwelve", "SM3", "Streebog"]
# pqc_agility_epoch removed: no agility mechanism is implemented.
# Algorithm rotation is a post-genesis protocol change that requires a new genesis.

[validation]
interval_precision_digits = 12
gershgorin_precheck = true
symmetry_enforcement = "strict"
cross_isa_determinism_required = true

# ---------------------------------------------------------------------------
# v1.1 additions (append-only; modifying existing fields defines a new network)
# ---------------------------------------------------------------------------

[cascade.health]
# CASCADE_DEPTH: max consecutive fully-idle epochs before cascade_health saturates.
# Wire format: cascade_health:u32 committed in FULL_STATE_FIXED_BYTES (v1.1 = 120).
depth = 8
health_threshold = 8
# Epochs before v1.0 envelopes are rejected by version gating (item 2-F).
compatibility_window = 100
# cascade_health_factor: weight in Lyapunov extension (reserved; not yet active in v1.1.0).
cascade_health_factor = 50_000

[epoch.skew]
# SKEW_BOUND: max future epochs an envelope may claim (validate_envelope_epoch).
epoch_skew_bound = 1

[protocol.versioning]
# Wire protocol version constants.
version_v1_0 = 0x1000
version_v1_1 = 0x1100
# Floor version below which envelopes are rejected after compatibility_window expires.
compat_version_floor = 0x1000
