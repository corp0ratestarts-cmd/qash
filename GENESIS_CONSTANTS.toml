# Informational only. Does not affect verification_rule.

[genesis.entropy]
algorithm = "QASH-ENTROPY-MIX-v1"
sources_required = 2
sources = ["drand", "nist_beacon", "bitcoin_block_optional"]
entropy_rule = "SHA3-512(drand_randomness || nist_beacon_value || bitcoin_block_hash_if_present || genesis_hash_bytes)"
