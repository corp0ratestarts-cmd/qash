name: Cross-Platform Determinism
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/consensus/**'
      - 'tests/vector-runner/**'
      - 'tests/vectors/**'
      - 'scripts/verify_cross_isa_identity.sh'
      - '.github/workflows/platform-determinism.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          targets: |
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            riscv64gc-unknown-linux-gnu
      - name: Install cross runners and linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu \
            qemu-user
      - name: Verify cross-ISA vector identity
        run: scripts/verify_cross_isa_identity.sh
