name: Cross-Platform Determinism
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # Compares CONSENSUS STATE ROOTS (not binary hashes) across ISAs — verifies TH-7.
  # Step 1: compute the canonical state root on the native x86_64 runner.
  # This becomes the reference that all cross-compiled targets must match.
  native-root:
    runs-on: ubuntu-latest
    outputs:
      state_root: ${{ steps.capture.outputs.state_root }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Run canonical root test
        id: capture
        run: |
          ROOT=$(cargo test -p qash-consensus --no-default-features \
                   state_root_canonical_seq_print -- --nocapture 2>/dev/null \
                 | grep 'CANONICAL_STATE_ROOT_3_EPOCHS' | head -1)
          echo "state_root=${ROOT}" >> "$GITHUB_OUTPUT"
          echo "Native state root: ${ROOT}"
      - name: Run native replay vector gates
        run: |
          cargo test -p qash-consensus --no-default-features --test v1_1_replay v1_1_corpus_matches_pinned
          cargo test -p qash-consensus --no-default-features --test v1_2_sharded_replay v1_2_sharded_corpus_matches_pinned

  # Step 2: cross-compile and run via QEMU user-static (no Docker required).
  # Uses .cargo/config.toml runners: qemu-aarch64-static -L /usr/aarch64-linux-gnu
  # and qemu-riscv64-static -L /usr/riscv64-linux-gnu.
  cross-verify:
    needs: native-root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-riscv64-cross
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross-compile toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing qemu-user-static ${{ matrix.packages }}
      - name: Run canonical root test on ${{ matrix.target }}
        run: |
          ROOT=$(cargo test -p qash-consensus --no-default-features \
                   --target ${{ matrix.target }} \
                   state_root_canonical_seq_print -- --nocapture 2>/dev/null \
                 | grep 'CANONICAL_STATE_ROOT_3_EPOCHS' | head -1)
          echo "Target (${{ matrix.target }}) state root: ${ROOT}"
          EXPECTED="${{ needs.native-root.outputs.state_root }}"
          if [ "${ROOT}" != "${EXPECTED}" ]; then
            echo "ERROR: state root divergence!"
            echo "  native:  ${EXPECTED}"
            echo "  ${{ matrix.target }}: ${ROOT}"
            exit 1
          fi
          echo "OK: roots match"
      - name: Run full test suite on ${{ matrix.target }}
        run: |
          cargo test -p qash-consensus --no-default-features \
            --target ${{ matrix.target }}
      - name: Run replay vector gates on ${{ matrix.target }}
        run: |
          cargo test -p qash-consensus --no-default-features \
            --target ${{ matrix.target }} \
            --test v1_1_replay v1_1_corpus_matches_pinned
          cargo test -p qash-consensus --no-default-features \
            --target ${{ matrix.target }} \
            --test v1_2_sharded_replay v1_2_sharded_corpus_matches_pinned
