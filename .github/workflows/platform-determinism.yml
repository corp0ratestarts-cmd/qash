name: Cross-Platform Determinism
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # Compares CONSENSUS STATE ROOTS (not binary hashes) across ISAs — verifies TH-7.
  # Step 1: compute the canonical state roots on the native x86_64 runner.
  # These become the references that all cross-compiled targets must match.
  native-root:
    runs-on: ubuntu-latest
    outputs:
      state_root: ${{ steps.capture.outputs.state_root }}
      pal_state_root: ${{ steps.capture_pal.outputs.pal_state_root }}
      pal_efb_root: ${{ steps.capture_pal.outputs.pal_efb_root }}
      pal_receipt_root: ${{ steps.capture_pal.outputs.pal_receipt_root }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Run canonical root test
        id: capture
        run: |
          ROOT=$(cargo test -p qash-consensus --no-default-features \
                   state_root_canonical_seq_print -- --nocapture 2>/dev/null \
                 | grep 'CANONICAL_STATE_ROOT_3_EPOCHS' | head -1)
          echo "state_root=${ROOT}" >> "$GITHUB_OUTPUT"
          echo "Native state root: ${ROOT}"
      - name: Run native replay vector gates
        run: |
          cargo test -p qash-consensus --no-default-features --test v1_1_replay v1_1_corpus_matches_pinned
          cargo test -p qash-consensus --no-default-features --test v1_2_sharded_replay v1_2_sharded_corpus_matches_pinned
      # ── Hosted whole-protocol sharded replay cross-ISA evidence (TH-7) ──────
      # Captures state_root, efb_root, receipt_root from a 5-epoch PAL sharded
      # replay. The golden test in whole_protocol.rs pins these values; the
      # cross-verify job re-runs them on aarch64 and riscv64gc to confirm that
      # the hosted PAL layer is also ISA-invariant, not just the consensus kernel.
      - name: Capture hosted whole-protocol sharded roots (native)
        id: capture_pal
        run: |
          OUTPUT=$(cargo test -p qash-pal --features std --test whole_protocol \
                    -- whole_protocol_sharded_canonical_roots_print --nocapture 2>/dev/null)
          PAL_SR=$(echo  "$OUTPUT" | grep 'CANONICAL_SHARDED_STATE_ROOT_5_EPOCHS'   | head -1)
          PAL_EFB=$(echo "$OUTPUT" | grep 'CANONICAL_SHARDED_EFB_ROOT_5_EPOCHS'     | head -1)
          PAL_RR=$(echo  "$OUTPUT" | grep 'CANONICAL_SHARDED_RECEIPT_ROOT_5_EPOCHS' | head -1)
          echo "pal_state_root=${PAL_SR}"   >> "$GITHUB_OUTPUT"
          echo "pal_efb_root=${PAL_EFB}"    >> "$GITHUB_OUTPUT"
          echo "pal_receipt_root=${PAL_RR}" >> "$GITHUB_OUTPUT"
          echo "Native PAL sharded roots: state=${PAL_SR} efb=${PAL_EFB} receipt=${PAL_RR}"
      - name: Assert hosted whole-protocol sharded golden roots (native)
        run: |
          cargo test -p qash-pal --features std --test whole_protocol \
            whole_protocol_sharded_canonical_roots_golden

  # Step 2: cross-compile and run via QEMU user-static (no Docker required).
  # Uses .cargo/config.toml runners: qemu-aarch64-static -L /usr/aarch64-linux-gnu
  # and qemu-riscv64-static -L /usr/riscv64-linux-gnu.
  cross-verify:
    needs: native-root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-riscv64-cross
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross-compile toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing qemu-user-static ${{ matrix.packages }}
      - name: Run canonical root test on ${{ matrix.target }}
        run: |
          ROOT=$(cargo test -p qash-consensus --no-default-features \
                   --target ${{ matrix.target }} \
                   state_root_canonical_seq_print -- --nocapture 2>/dev/null \
                 | grep 'CANONICAL_STATE_ROOT_3_EPOCHS' | head -1)
          echo "Target (${{ matrix.target }}) state root: ${ROOT}"
          EXPECTED="${{ needs.native-root.outputs.state_root }}"
          if [ "${ROOT}" != "${EXPECTED}" ]; then
            echo "ERROR: state root divergence!"
            echo "  native:  ${EXPECTED}"
            echo "  ${{ matrix.target }}: ${ROOT}"
            exit 1
          fi
          echo "OK: consensus roots match"
      - name: Run full test suite on ${{ matrix.target }}
        run: |
          cargo test -p qash-consensus --no-default-features \
            --target ${{ matrix.target }}
      - name: Run replay vector gates on ${{ matrix.target }}
        run: |
          cargo test -p qash-consensus --no-default-features \
            --target ${{ matrix.target }} \
            --test v1_1_replay v1_1_corpus_matches_pinned
          cargo test -p qash-consensus --no-default-features \
            --target ${{ matrix.target }} \
            --test v1_2_sharded_replay v1_2_sharded_corpus_matches_pinned
      # ── Hosted whole-protocol sharded replay cross-ISA evidence (TH-7) ──────
      - name: Run hosted whole-protocol sharded golden roots on ${{ matrix.target }}
        run: |
          cargo test -p qash-pal --features std --test whole_protocol \
            --target ${{ matrix.target }} \
            whole_protocol_sharded_canonical_roots_golden
      - name: Compare hosted PAL sharded roots against native reference
        run: |
          OUTPUT=$(cargo test -p qash-pal --features std --test whole_protocol \
                    --target ${{ matrix.target }} \
                    -- whole_protocol_sharded_canonical_roots_print --nocapture 2>/dev/null)
          PAL_SR=$(echo  "$OUTPUT" | grep 'CANONICAL_SHARDED_STATE_ROOT_5_EPOCHS'   | head -1)
          PAL_EFB=$(echo "$OUTPUT" | grep 'CANONICAL_SHARDED_EFB_ROOT_5_EPOCHS'     | head -1)
          PAL_RR=$(echo  "$OUTPUT" | grep 'CANONICAL_SHARDED_RECEIPT_ROOT_5_EPOCHS' | head -1)
          FAIL=0
          if [ "${PAL_SR}"  != "${{ needs.native-root.outputs.pal_state_root }}" ];   then
            echo "ERROR: pal state_root divergence on ${{ matrix.target }}"
            echo "  native:  ${{ needs.native-root.outputs.pal_state_root }}"
            echo "  target:  ${PAL_SR}"
            FAIL=1
          fi
          if [ "${PAL_EFB}" != "${{ needs.native-root.outputs.pal_efb_root }}" ];     then
            echo "ERROR: pal efb_root divergence on ${{ matrix.target }}"
            echo "  native:  ${{ needs.native-root.outputs.pal_efb_root }}"
            echo "  target:  ${PAL_EFB}"
            FAIL=1
          fi
          if [ "${PAL_RR}"  != "${{ needs.native-root.outputs.pal_receipt_root }}" ]; then
            echo "ERROR: pal receipt_root divergence on ${{ matrix.target }}"
            echo "  native:  ${{ needs.native-root.outputs.pal_receipt_root }}"
            echo "  target:  ${PAL_RR}"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then exit 1; fi
          echo "OK: PAL sharded roots match native on ${{ matrix.target }}"
