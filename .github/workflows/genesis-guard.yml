name: Genesis Guard

on:
  pull_request:
    paths:
      - 'GENESIS_CONSTANTS.toml'
      - 'spec/genesis-artifacts.txt'
      - 'spec/pdf/**'
      - 'docs/traceability.md'
      - 'docs/errata/**'
      - 'docs/adr/**'
      - 'docs/spec/**'
      - 'tests/vectors/**'
      - 'rust-toolchain.toml'
      - 'scripts/verify_genesis_hash.sh'

jobs:
  genesis-change-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify genesis artifact-set hash
        run: ./scripts/verify_genesis_hash.sh
      - name: Require human acknowledgment for genesis artifact changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qF '[genesis-change-acknowledged]'; then
            echo "Genesis change acknowledged. Proceeding."
          elif grep -q '^genesis_status = "provisional"$' GENESIS_CONSTANTS.toml \
            && grep -q '^deployment_authoritative = false$' GENESIS_CONSTANTS.toml; then
            echo "Pre-genesis provisional artifact drift detected."
            echo "No genesis acknowledgment token required until deployment_authoritative=true."
          else
            echo ""
            echo "ERROR: the genesis artifact set was modified but the PR body"
            echo "does not contain the required acknowledgment token."
            echo ""
            echo "Genesis artifact changes may define a new network and must be"
            echo "reviewed by a human before merge. Add this exact token to"
            echo "the PR description to unblock this check:"
            echo ""
            echo "    [genesis-change-acknowledged]"
            echo ""
            echo "See .github/PULL_REQUEST_TEMPLATE.md for the full checklist."
            exit 1
          fi
