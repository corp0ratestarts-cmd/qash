name: Fuzz Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # Override rust-toolchain.toml (which pins stable) so every cargo
      # invocation in this job uses nightly without needing +nightly flags.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Setup nightly Rust (required for libfuzzer)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache cargo-fuzz binary
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-nightly

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz

      # cargo fuzz run must be run from the project root so it can locate
      # ./fuzz/Cargo.toml. Running from inside fuzz/ would look for fuzz/fuzz/.
      - name: Smoke — cascade_fuzz (15 s)
        run: cargo fuzz run cascade_fuzz -- -max_total_time=15

      - name: Smoke — decode_fuzz (15 s)
        run: cargo fuzz run decode_fuzz -- -max_total_time=15

      - name: Smoke — transition_fuzz (15 s)
        run: cargo fuzz run transition_fuzz -- -max_total_time=15

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
