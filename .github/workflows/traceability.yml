name: Traceability Gate

on: [push, pull_request]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check traceability document exists
        run: test -f docs/traceability.md
      - name: Report unresolved P0 items
        run: |
          count=$(awk '/^## P0 /,/^---$|^## P1|^## P[1-9]/ { print }' docs/traceability.md | grep -cE '❌|🔶' || true)
          echo "Unresolved P0 markers: ${count}"
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]] && [ "${count}" -gt 0 ]; then
            echo "::error::Cannot release with unresolved P0 traceability gaps"
            exit 1
          fi
      - name: Require PDF-SILENT rows to reference ADRs
        run: |
          if grep -n 'PDF-SILENT' docs/traceability.md | grep -v 'ADR' ; then
            echo "::error::PDF-SILENT traceability rows must reference an ADR"
            exit 1
          fi
