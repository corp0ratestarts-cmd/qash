name: MVP Demo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  mvp-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Test workspace (with std)
        run: cargo test --workspace

      - name: Test workspace (no-default-features)
        run: cargo test --workspace --no-default-features

      - name: Run MVP demo end-to-end
        run: bash scripts/run_mvp_demo.sh --clean

      - name: Generate replay report for bundle validation
        run: |
          cargo run --quiet --bin qash-demo -- replay \
            --dir artifacts/mvp-demo/node-a \
            --report artifacts/mvp-demo/replay.json

      - name: Validate pilot evidence bundle (dry-run)
        env:
          DEMO_DIR: artifacts/mvp-demo
        run: bash scripts/build_pilot_evidence_bundle.sh --dry-run

      - name: Validate pilot script syntax
        run: bash -n scripts/capture_benchmarks.sh
