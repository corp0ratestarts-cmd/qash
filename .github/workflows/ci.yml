name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (PDF pin §8.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy

      - name: Build + tests
        run: cargo test --workspace --no-default-features

      - name: Clippy (consensus — strict)
        run: cargo clippy -p qash-consensus --no-default-features -- -D clippy::unwrap_used -D clippy::expect_used -D warnings

      - name: Clippy (workspace)
        run: cargo clippy --workspace --no-default-features -- -D warnings

      - name: Vector runner — x86_64 golden pass
        run: |
          cargo build -p qash-vector-runner --no-default-features
          ./target/debug/qash-vector-runner --vectors tests/vectors/vectors.v1.json --out /tmp/x86_64_results.json
          echo "x86_64 vector run complete"

  coq-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Coq (8.18 via apt)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y coq

      - name: Build Coq proofs
        working-directory: proofs
        run: make all

      - name: No-Admitted gate (gated proofs only)
        working-directory: proofs
        run: |
          # cascade_collision_resistance.v uses Axiom (cryptographic assumption) — not Admitted
          # Exclude _wip/ drafts which are explicitly not gated
          if grep -r --include="*.v" "Admitted\." contractivity/ cascade/cascade_health_bounded.v; then
            echo "ERROR: Admitted marker found in gated proof scope"
            exit 1
          fi
          echo "No Admitted markers in gated proof scope"

  cross-isa:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain with cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          targets: aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu

      - name: Install cross-compilation tools and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu \
            libc6-arm64-cross \
            libc6-riscv64-cross \
            qemu-user

      - name: Cross-ISA determinism
        run: |
          chmod +x scripts/verify_cross_isa_identity.sh
          ./scripts/verify_cross_isa_identity.sh
