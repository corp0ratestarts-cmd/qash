name: QASH CI

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  slice-evidence-freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert fresh slice evidence manifest for slice-critical changes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bash scripts/check_slice_evidence_freshness.sh

  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Build
        run: cargo build --no-default-features

  test-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Test
        run: cargo test --workspace --no-default-features
      - name: Verify deterministic build pipeline
        run: ./scripts/verify_two_stage_build.sh
      - name: Verify genesis artifact-set hash
        run: ./scripts/verify_genesis_hash.sh

  clippy-lint:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Clippy (consensus)
        run: cargo clippy -p qash-consensus -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable -D warnings
      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

  document-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject raw transcripts and ad hoc root specs
        run: bash scripts/check_document_hygiene.sh
      - name: Privacy admission checklist lint (P5/P7/P8)
        run: bash scripts/check_privacy_admission.sh

  zero-persistence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Check zero-persistence PAL boundary
        run: bash scripts/check_zero_persistence_boundary.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Record Coq version
        run: coqc --version | tee proof-coq-version.txt
      - name: Reject admitted active proofs
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          def strip_coq_comments(text):
              out = []
              depth = 0
              i = 0
              while i < len(text):
                  if text.startswith("(*", i):
                      depth += 1
                      i += 2
                  elif depth and text.startswith("*)", i):
                      depth -= 1
                      i += 2
                  else:
                      out.append("\n" if depth and text[i] == "\n" else (text[i] if depth == 0 else " "))
                      i += 1
              return "".join(out)

          pattern = re.compile(r"\b(Admitted|admit)\b")
          failures = []
          for path in pathlib.Path("proofs").rglob("*.v"):
              if "_wip" in path.parts:
                  continue
              text = strip_coq_comments(path.read_text())
              for line_no, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      failures.append(f"{path}:{line_no}: {line.strip()}")

          if failures:
              print("Active proof files contain admitted proof markers:")
              print("\n".join(failures))
              sys.exit(1)
          PY
      - name: Fetch base ref for axiom guard
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
      - name: Check axiom coverage map
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check_axiom_coverage.sh
      - name: Compile active Coq proofs
        working-directory: proofs
        run: make all
      - name: Record proof-object hashes
        working-directory: proofs
        run: |
          COQ_VER="$(coqc --version 2>&1 | head -1)"
          { echo "# coq-version: $COQ_VER"; find . -name "*.vo" | sort | xargs sha256sum; } \
            > ../proof-hashes.txt
      - name: Commit proof-hash manifest to artifact-index (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MANIFEST="proofs/artifact-index/proof-hashes-${{ github.sha }}.txt"
          cp proof-hashes.txt "$MANIFEST"
          git add "$MANIFEST"
          git diff --staged --quiet || \
            git commit -m "ci: record proof hashes for ${{ github.sha }} [skip ci]"
          git push origin HEAD:main || true
      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-objects-${{ github.sha }}
          path: |
            proof-coq-version.txt
            proof-hashes.txt
          if-no-files-found: error
          retention-days: 365

  kani-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Install Kani
        run: cargo install kani-verifier --version 0.67.0 --locked
      - name: Set up Kani
        run: cargo kani setup
      - name: Verify consensus Kani harnesses
        run: scripts/run_kani_consensus.sh

  domain-a-tripwires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Domain A tripwire scan
        run: bash scripts/check_domain_a_tripwires.sh

  hardware-opsec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Hardware OpSec anti-drift scan
        run: bash scripts/check_hardware_opsec_drift.sh

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:rust

  osv-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: OSV dependency vulnerability scan (advisory)
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=Cargo.lock
        env:
          OSV_SCANNER_FAIL_ON_VULN: "false"

  scorecard:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard (advisory)
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: "**/*.cdx.json"
          if-no-files-found: warn
          retention-days: 365

  cavp-kat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Run SHA3-256 CAVP KAT vectors
        run: cargo test -p qash-consensus --no-default-features -- hash::tests --nocapture
