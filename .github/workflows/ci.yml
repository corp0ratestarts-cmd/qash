name: QASH CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Build
        run: cargo build --no-default-features

  test-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Test
        run: cargo test --workspace --no-default-features
      - name: Verify deterministic build pipeline
        run: ./scripts/verify_two_stage_build.sh
      - name: Verify genesis artifact-set hash
        run: ./scripts/verify_genesis_hash.sh

  clippy-lint:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Clippy (consensus)
        run: cargo clippy -p qash-consensus -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable -D warnings
      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

  document-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject raw transcripts and ad hoc root specs
        run: bash scripts/check_document_hygiene.sh
      - name: Privacy admission checklist lint (P5/P7/P8)
        run: bash scripts/check_privacy_admission.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  proofs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Record Coq version
        run: coqc --version | tee proof-coq-version.txt
      - name: Reject admitted active proofs
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          def strip_coq_comments(text):
              out = []
              depth = 0
              i = 0
              while i < len(text):
                  if text.startswith("(*", i):
                      depth += 1
                      i += 2
                  elif depth and text.startswith("*)", i):
                      depth -= 1
                      i += 2
                  else:
                      out.append("\n" if depth and text[i] == "\n" else (text[i] if depth == 0 else " "))
                      i += 1
              return "".join(out)

          pattern = re.compile(r"\b(Admitted|admit)\b")
          failures = []
          for path in pathlib.Path("proofs").rglob("*.v"):
              if "_wip" in path.parts:
                  continue
              text = strip_coq_comments(path.read_text())
              for line_no, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      failures.append(f"{path}:{line_no}: {line.strip()}")

          if failures:
              print("Active proof files contain admitted proof markers:")
              print("\n".join(failures))
              sys.exit(1)
          PY
      - name: Fetch base ref for axiom guard
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
      - name: Check axiom coverage map
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check_axiom_coverage.sh
      - name: Compile active Coq proofs
        working-directory: proofs
        run: make all
      - name: Record proof-object hashes
        # Produces a reproducibility manifest: auditors can verify .vo files
        # match a specific Coq version + source commit pair.
        working-directory: proofs
        run: |
          COQ_VER="$(coqc --version 2>&1 | head -1)"
          { echo "# coq-version: $COQ_VER"; find . -name "*.vo" | sort | xargs sha256sum; } \
            > ../proof-hashes.txt
      - name: Commit proof-hash manifest to artifact-index (main only)
        # Permanently records proof-object hashes in the git history so auditors
        # can verify proofs for any commit long after CI artifacts expire.
        # [skip ci] prevents the commit from triggering another CI run.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MANIFEST="proofs/artifact-index/proof-hashes-${{ github.sha }}.txt"
          cp proof-hashes.txt "$MANIFEST"
          git add "$MANIFEST"
          git diff --staged --quiet || \
            git commit -m "ci: record proof hashes for ${{ github.sha }} [skip ci]"
          git push origin HEAD:main || true
      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-objects-${{ github.sha }}
          path: |
            proof-coq-version.txt
            proof-hashes.txt
          if-no-files-found: error
          retention-days: 365

  kani-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Install Kani
        run: cargo install kani-verifier --version 0.67.0 --locked
      - name: Set up Kani
        run: cargo kani setup
      - name: Verify consensus Kani harnesses
        run: scripts/run_kani_consensus.sh
