name: QASH CI

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  slice-evidence-freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert fresh slice evidence manifest for slice-critical changes
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bash scripts/check_slice_evidence_freshness.sh

  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Build
        run: cargo build --no-default-features

  test-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Test
        run: cargo test --workspace --no-default-features
      - name: Verify deterministic build pipeline
        run: ./scripts/verify_two_stage_build.sh
      - name: Verify genesis artifact-set hash
        run: ./scripts/verify_genesis_hash.sh

  clippy-lint:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Clippy (consensus)
        run: cargo clippy -p qash-consensus -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable -D warnings
      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

  document-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject raw transcripts and ad hoc root specs
        run: bash scripts/check_document_hygiene.sh
      - name: Privacy admission checklist lint (P5/P7/P8)
        run: bash scripts/check_privacy_admission.sh

  zero-persistence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Check zero-persistence PAL boundary
        run: bash scripts/check_zero_persistence_boundary.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Record Coq version
        run: coqc --version | tee proof-coq-version.txt
      - name: Reject admitted active proofs
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          def strip_coq_comments(text):
              out = []
              depth = 0
              i = 0
              while i < len(text):
                  if text.startswith("(*", i):
                      depth += 1
                      i += 2
                  elif depth and text.startswith("*)", i):
                      depth -= 1
                      i += 2
                  else:
                      out.append("\n" if depth and text[i] == "\n" else (text[i] if depth == 0 else " "))
                      i += 1
              return "".join(out)

          pattern = re.compile(r"\b(Admitted|admit)\b")
          failures = []
          for path in pathlib.Path("proofs").rglob("*.v"):
              if "_wip" in path.parts:
                  continue
              text = strip_coq_comments(path.read_text())
              for line_no, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      failures.append(f"{path}:{line_no}: {line.strip()}")

          if failures:
              print("Active proof files contain admitted proof markers:")
              print("\n".join(failures))
              sys.exit(1)
          PY
      - name: Fetch base ref for axiom guard
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
      - name: Check axiom coverage map
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check_axiom_coverage.sh
      - name: Compile active Coq proofs
        working-directory: proofs
        run: make all
      - name: Record proof-object hashes
        working-directory: proofs
        run: |
          COQ_VER="$(coqc --version 2>&1 | head -1)"
          { echo "# coq-version: $COQ_VER"; find . -name "*.vo" | sort | xargs sha256sum; } \
            > ../proof-hashes.txt
      - name: Commit proof-hash manifest to artifact-index (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MANIFEST="proofs/artifact-index/proof-hashes-${{ github.sha }}.txt"
          cp proof-hashes.txt "$MANIFEST"
          git add "$MANIFEST"
          git diff --staged --quiet || \
            git commit -m "ci: record proof hashes for ${{ github.sha }} [skip ci]"
          git push origin HEAD:main || true
      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-objects-${{ github.sha }}
          path: |
            proof-coq-version.txt
            proof-hashes.txt
          if-no-files-found: error
          retention-days: 365

  kani-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Install Kani
        run: cargo install kani-verifier --version 0.67.0 --locked
      - name: Set up Kani
        run: cargo kani setup
      - name: Verify consensus Kani harnesses
        run: scripts/run_kani_consensus.sh

  domain-a-tripwires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Domain A tripwire scan
        run: bash scripts/check_domain_a_tripwires.sh

  hardware-opsec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Hardware OpSec anti-drift scan
        run: bash scripts/check_hardware_opsec_drift.sh

  codeql:
    runs-on: ubuntu-latest
    # Advisory until findings are triaged and suppressions/exceptions are documented.
    continue-on-error: true
    steps:
      - name: Defer CodeQL to repository default setup
        run: |
          echo "Repository CodeQL default setup is enabled."
          echo "Skipping custom CodeQL advanced setup to avoid duplicate code-scanning uploads."

  osv-scan:
    runs-on: ubuntu-latest
    # Blocking: any unignored CVE fails the job. Known exceptions are in osv-ignore.toml.
    steps:
      - uses: actions/checkout@v4
      - name: OSV dependency vulnerability scan
        id: osv-scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --config=osv-ignore.toml
      - name: Fail on OSV findings
        if: steps.osv-scan.outcome == 'failure'
        run: |
          echo "OSV scan found unignored vulnerabilities. Add justified exceptions to osv-ignore.toml."
          exit 1

  scorecard:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # Advisory until repository-level supply-chain posture controls are configured.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.sha }}
          path: scorecard-results.sarif
          if-no-files-found: warn
          retention-days: 365

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: "**/*.cdx.json"
          if-no-files-found: warn
          retention-days: 365

  cavp-kat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Run SHA3-256 CAVP KAT vectors (NIST FIPS 202)
        run: cargo test -p qash-consensus --no-default-features -- hash::tests::cavp_sha3_256 --nocapture
      - name: Run HMAC-SHA-256 CAVP KAT vectors (RFC 4231 / NIST SP 800-198)
        run: cargo test -p qash-pal -- crypto::drbg::tests::cavp_hmac_sha256 --nocapture
      - name: Run ML-KEM-768 CAVP KAT vectors (FIPS 203)
        run: cargo test -p qash-pal --features pqc -- crypto::kem::tests::cavp_ml_kem_768 --nocapture
      - name: Constant-time audit gate
        run: cargo test -p qash-pal -p qash-pal --tests -- constant_time_audit --nocapture
      - name: Run Plonky3 FRI-STARK 2-layer recursion corpus KAT (QASH PR#93 profile)
        run: cargo test -p qash-pal --features "plonky3,std" -- two_layer_recursion_corpus_kat_commitment two_layer_pipeline_e2e_fibonacci --nocapture
      - name: Run adversarial shard-capture simulation (5-A gate)
        run: cargo test -p qash-consensus --no-default-features --test shard_capture_simulation -- --nocapture

  miri-consensus:
    runs-on: ubuntu-latest
    # Advisory: runs Miri on consensus library unit tests to catch UB in our own code.
    # continue-on-error because sha3/blake3/tiny-keccak dependencies have pointer patterns
    # that Miri flags regardless of aliasing model; failures are diagnostic, not blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri via rustup nightly
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Run Miri on consensus unit tests
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows"
        run: cargo +nightly miri test -p qash-consensus --no-default-features --lib

  vector-integrity:
    runs-on: ubuntu-latest
    # Blocking: the golden test vector file must not drift without an ADR-003 version bump.
    steps:
      - uses: actions/checkout@v4
      - name: Verify golden vector file hash
        run: |
          if [ ! -f tests/vectors/vector-hashes.txt ]; then
            echo "tests/vectors/vector-hashes.txt not found; cannot verify vector integrity." >&2
            exit 1
          fi
          recorded=$(grep '^vectors.v1.json:' tests/vectors/vector-hashes.txt | cut -d: -f2 | tr -d ' ')
          if [ -z "$recorded" ]; then
            echo "No 'vectors.v1.json:' entry in tests/vectors/vector-hashes.txt" >&2
            exit 1
          fi
          computed=$(sha256sum tests/vectors/vectors.v1.json | awk '{print $1}')
          if [ "$computed" != "$recorded" ]; then
            echo "Golden vector hash mismatch!" >&2
            echo "  recorded: $recorded" >&2
            echo "  computed: $computed" >&2
            echo "Update tests/vectors/vector-hashes.txt and bump ADR-003 version to acknowledge the change." >&2
            exit 1
          fi
          echo "Vector integrity check passed: $computed"

  bench-gate:
    runs-on: ubuntu-latest
    # Advisory: warns on >10% TPS regression, hard-fails only with stable runner or repeated confirmation.
    # GitHub-hosted runners are noisy; a single data point must not block unrelated correctness work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Run consensus benchmarks
        run: |
          cargo bench -p qash-consensus --no-default-features 2>&1 | tee /tmp/bench_output.txt || true
          echo "Benchmark run complete. Results in /tmp/bench_output.txt"
          cat /tmp/bench_output.txt
      - name: Check benchmark regression against baseline
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib

          baseline_path = pathlib.Path("benchmarks/baseline.json")
          if not baseline_path.exists():
              print("No benchmarks/baseline.json; skipping regression check.")
              sys.exit(0)

          baseline = json.loads(baseline_path.read_text())
          bench_output = pathlib.Path("/tmp/bench_output.txt").read_text()

          # Parse Criterion output: "bench_name ... time: [X.XX ns X.XX ns X.XX ns]"
          pattern = re.compile(r"^(\S.*?)\s+time:\s+\[[\d.]+ \w+\s+([\d.]+) (\w+)", re.MULTILINE)

          warnings = []
          for m in pattern.finditer(bench_output):
              name = m.group(1).strip()
              val = float(m.group(2))
              unit = m.group(3)
              # Normalise to ns
              scale = {"ns": 1, "µs": 1000, "us": 1000, "ms": 1_000_000, "s": 1_000_000_000}.get(unit, 1)
              measured_ns = val * scale

              for bname, bdata in baseline.get("benchmarks", {}).items():
                  if bname.endswith(name) or name.endswith(bname.split("/")[-1]):
                      baseline_ns = bdata.get("mean_ns")
                      if baseline_ns is None:
                          continue
                      delta_pct = (measured_ns - baseline_ns) / baseline_ns * 100
                      policy = baseline.get("regression_policy", {})
                      warn_thresh = policy.get("warning_threshold_pct", 10)
                      hard_thresh = policy.get("hard_fail_threshold_pct", 25)
                      if delta_pct > warn_thresh:
                          warnings.append(f"WARN: {name}: +{delta_pct:.1f}% regression ({measured_ns:.0f}ns vs baseline {baseline_ns}ns)")
                      if delta_pct > hard_thresh:
                          # Advisory only: note it but do not exit 1 (runner noise policy)
                          warnings.append(f"NOTE: {name}: exceeds hard-fail threshold (+{delta_pct:.1f}%), but bench-gate is advisory on GitHub-hosted runners")

          if warnings:
              for w in warnings:
                  print(w)
          else:
              print("Benchmark regression check: no regressions detected (or no matching baseline entries).")
          sys.exit(0)
          PY
      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: bench-output-${{ github.sha }}
          path: /tmp/bench_output.txt
          if-no-files-found: ignore
          retention-days: 30
