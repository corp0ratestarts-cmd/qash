name: QASH CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --no-default-features
      - name: Test
        run: cargo test --no-default-features
      - name: Replay vector regression suite
        run: cargo test -p qash-consensus --test replay_vectors --no-default-features
      - name: Clippy (consensus)
        run: cargo clippy -p qash-consensus -- -D clippy::unwrap_used -D clippy::expect_used -D warnings
      - name: Clippy (workspace)
        run: cargo clippy -- -D warnings
