name: Fuzzing (cargo-fuzz)

on:
  pull_request:
    paths:
      - 'crates/consensus/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Verify fuzz targets exist
        run: |
          test -f fuzz/Cargo.toml
          cargo fuzz list
      - name: Run fuzz target smoke (30s)
        run: cargo fuzz run tx_decode -- -max_total_time=30
