name: Security Compliance Preflight

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  codeql:
    name: CodeQL Rust
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended,security-and-quality
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: Build workspace for CodeQL
        run: cargo build --workspace --all-features
      - uses: github/codeql-action/analyze@v4

  osv:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            .

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: artifacts/compliance/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/compliance/sbom.cdx.json
          if-no-files-found: error
          retention-days: 365

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  rust-hygiene:
    name: Rust hygiene and advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: cargo geiger unsafe report
        run: |
          cargo install cargo-geiger --locked
          cargo geiger --all-features --output-format GitHubMarkdown
      - name: cargo machete unused dependency check
        run: |
          cargo install cargo-machete --locked
          cargo machete
      - name: cargo semver checks advisory
        run: |
          cargo install cargo-semver-checks --locked
          cargo semver-checks check-release || true

  domain-boundary-tripwires:
    name: QASH domain boundary tripwires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Domain A forbidden pattern scan
        run: bash scripts/check_domain_a_tripwires.sh
      - name: Hardware authority anti-drift scan
        run: bash scripts/check_hardware_opsec_drift.sh
