name: Security Compliance Preflight

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  codeql-note:
    name: CodeQL default setup note
    runs-on: ubuntu-latest
    steps:
      - name: Defer CodeQL to repository default setup
        run: |
          echo "Repository CodeQL default setup is enabled."
          echo "Skipping custom CodeQL advanced setup to avoid duplicate code-scanning uploads."

  osv:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            --experimental-offline-vulnerabilities
            --download-offline-databases
            .

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.sha }}
          path: scorecard-results.sarif
          if-no-files-found: warn
          retention-days: 365

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SBOM output directory
        run: mkdir -p artifacts/compliance
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: artifacts/compliance/sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: artifacts/compliance/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 365

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  rust-hygiene:
    name: Rust hygiene and advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Verify pinned Rust toolchain
        run: ./scripts/verify_rust_toolchain.sh
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: cargo geiger unsafe report
        continue-on-error: true
        run: |
          cargo install cargo-geiger --locked || exit 0
          cargo geiger --all-features --output-format GitHubMarkdown || true
      - name: cargo machete unused dependency check
        continue-on-error: true
        run: |
          cargo install cargo-machete --locked || exit 0
          cargo machete || true
      - name: cargo semver checks advisory
        continue-on-error: true
        run: |
          cargo install cargo-semver-checks --locked || exit 0
          cargo semver-checks check-release || true

  domain-boundary-tripwires:
    name: QASH domain boundary tripwires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Domain A forbidden pattern scan
        run: bash scripts/check_domain_a_tripwires.sh
      - name: Hardware authority anti-drift scan
        run: bash scripts/check_hardware_opsec_drift.sh
