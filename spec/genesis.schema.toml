# QASH Genesis Constants Schema — generated by `cargo run --bin generate-schema`
# DO NOT EDIT BY HAND.  Regenerate with: cargo run --bin generate-schema > spec/genesis.schema.toml
# Verify parity with: cargo run --bin generate-schema -- --check
#
# This file pins the normative values for every field that participates in
# Domain A logic (Lyapunov weights, cascade params, fixed-point config).
# Any drift between GENESIS_CONSTANTS.toml and this schema breaks CI.

[meta]
version = "1.1.0"
lock_algorithm = "QASH-CASCADE-7"

[fixed_point]
scale = 1000000
intermediate_width = 128
overflow_policy = "absorbing_halt"

[lyapunov]
weight_divergence_D = 350000
weight_conflict_C = 300000
weight_slash_Sigma = 200000
weight_cascade_health_CH = 150000
epsilon_threshold = 20000
max_queries_per_epoch = 1000000

[crypto.cascade]
cascade_depth = 7
cascade_composition_mode = "recursive_binding"
binding_primitive = "SHA3-512"
domain_separators = [
  "QASH:CASCADE:L1:PARALLEL",
  "QASH:CASCADE:L2:BIND",
  "QASH:CASCADE:L3:EXPAND",
  "QASH:CASCADE:L4:EXPAND",
  "QASH:CASCADE:L5:EXPAND",
  "QASH:CASCADE:L6:EXPAND",
  "QASH:CASCADE:L7:FINALIZE",
]
hash_primitives = ["SHA3-256", "BLAKE3", "KangarooTwelve", "SM3", "Streebog"]

[epoch.timing]
duration_ms = 500
max_control_loop_latency_ms = 450

[obfuscation]
leaf_index_bytes = 48
sparse_merkle_depth = 384
