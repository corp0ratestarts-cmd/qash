# QASH Genesis Constants Schema
#
# This file documents the normative field definitions for GENESIS_CONSTANTS.toml.
# It tracks two version lines separately:
#
#   [schema.v1_0] — the genesis-LOCKED v1.0 values matching GENESIS_CONSTANTS.toml
#   [lyapunov]    — the v1.1 runtime-active weights (feature-gated; NOT yet genesis-locked)
#
# Note: the "generate-schema" binary referenced in prior versions of this header
# does not exist. This file is maintained manually. The canonical values are in
# GENESIS_CONSTANTS.toml; this schema records both the v1.0 genesis-locked baseline
# and the v1.1 proposed weight overrides in separate sections.

# ---------------------------------------------------------------------------
# v1.0 Genesis-Locked Parameter Baseline
# These values MUST match GENESIS_CONSTANTS.toml [lyapunov] exactly.
# Any change here is a genesis-change-acknowledged event.
# ---------------------------------------------------------------------------
[schema.v1_0]
meta_version = "1.0.0"
lock_algorithm = "QASH-CASCADE-7"

# Lyapunov weights — genesis-locked v1.0 values
lyapunov_weight_divergence_D = 400_000
lyapunov_weight_conflict_C = 350_000
lyapunov_weight_slash_Sigma = 250_000
lyapunov_epsilon_threshold = 20_000
lyapunov_phi_max_safe = 500_000_000
lyapunov_evaluation_window = 3
lyapunov_max_queries_per_epoch = 1_000_000

# Fixed-point
fixed_point_scale = 1_000_000
fixed_point_intermediate_width = 128
fixed_point_overflow_policy = "absorbing_halt"

# ---------------------------------------------------------------------------
# Shared structural parameters (same in v1.0 and v1.1)
# ---------------------------------------------------------------------------
[meta]
lock_algorithm = "QASH-CASCADE-7"

[fixed_point]
scale = 1000000
intermediate_width = 128
overflow_policy = "absorbing_halt"

# ---------------------------------------------------------------------------
# v1.1 Lyapunov Weight Overrides (NOT genesis-locked; feature-gated)
# These are proposed v1.1 values. They are NOT active in GENESIS_CONSTANTS.toml.
# Activating these values requires a new genesis-change-acknowledged commit and
# a post-genesis migration ADR.
# ---------------------------------------------------------------------------
[lyapunov]
# v1.1 proposed weights (lower than v1.0; more conservative convergence pressure)
weight_divergence_D = 350000
weight_conflict_C = 300000
weight_slash_Sigma = 200000
# v1.1 extension: cascade health term (not present in v1.0 genesis constants)
weight_cascade_health_CH = 150000
epsilon_threshold = 20000
max_queries_per_epoch = 1000000

[crypto.cascade]
cascade_depth = 7
cascade_composition_mode = "recursive_binding"
binding_primitive = "SHA3-512"
domain_separators = [
  "QASH:CASCADE:L1:PARALLEL",
  "QASH:CASCADE:L2:BIND",
  "QASH:CASCADE:L3:EXPAND",
  "QASH:CASCADE:L4:EXPAND",
  "QASH:CASCADE:L5:EXPAND",
  "QASH:CASCADE:L6:EXPAND",
  "QASH:CASCADE:L7:FINALIZE",
]
hash_primitives = ["SHA3-256", "BLAKE3", "KangarooTwelve", "SM3", "Streebog"]

[epoch.timing]
duration_ms = 500
max_control_loop_latency_ms = 450

[obfuscation]
leaf_index_bytes = 48
sparse_merkle_depth = 384
