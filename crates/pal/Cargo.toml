[package]
name = "qash-pal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/root.rs"

[dependencies]
qash-consensus = { path = "../consensus", version = "0.1.0" }
hmac-drbg = "0.3.0"
sha2 = "0.9"
sha3 = "0.10"
ml-kem = { version = "0.3", optional = true }
sm3 = { version = "0.4", optional = true }
getrandom = { version = "0.2", optional = true }
typenum = "1.20.0"
zeroize = { version = "1", features = ["derive"] }
static_assertions = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
# Plonky3 FRI-STARK verifier stack (supply-chain vetted; gated by `plonky3` feature).
p3-uni-stark  = { version = "0.5.3", optional = true }
p3-baby-bear  = { version = "0.5.3", optional = true }
p3-field      = { version = "0.5.3", optional = true }
p3-symmetric  = { version = "0.5.3", optional = true }
p3-merkle-tree = { version = "0.5.3", optional = true }
p3-fri        = { version = "0.5.3", optional = true }
p3-challenger = { version = "0.5.3", optional = true }
p3-air        = { version = "0.5.3", optional = true }
p3-matrix     = { version = "0.5.3", optional = true }
p3-commit     = { version = "0.5.3", optional = true }
p3-dft        = { version = "0.5.3", optional = true }
postcard      = { version = "1", features = ["alloc"], optional = true }
serde         = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1", default-features = false }
static_assertions = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "mvp_vault"
harness = false
required-features = ["std"]

[features]
default = []
std = ["getrandom"]
replay-scaffold = ["std"]
zero-persistence = ["std"]
sovereign-hardened = ["zero-persistence"]
pqc = ["ml-kem"]
suite_guomi = ["sm3"]
suite_korea = []
# Plonky3 FRI-STARK verifier backend. Wires the p3-* crate stack and enables
# the production `Plonky3ProductionBackend` with hardcoded BabyBear+Poseidon2
# round constants (no trusted setup, transparent STARKs).
plonky3 = [
    "dep:p3-uni-stark", "dep:p3-baby-bear", "dep:p3-field",
    "dep:p3-symmetric", "dep:p3-merkle-tree", "dep:p3-fri",
    "dep:p3-challenger", "dep:p3-air", "dep:p3-matrix",
    "dep:p3-commit", "dep:p3-dft", "dep:postcard", "dep:serde",
]
