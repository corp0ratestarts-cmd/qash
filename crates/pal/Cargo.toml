[package]
name = "qash-pal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/root.rs"

[dependencies]
qash-consensus = { path = "../consensus", version = "0.1.0" }
hmac-drbg = "0.3.0"
sha2 = "0.9"
sha3 = "0.10"
ml-kem = { version = "0.3", optional = true }
sm3 = { version = "0.4", optional = true }
getrandom = { version = "0.2", optional = true }
typenum = "1.20.0"
zeroize = { version = "1", features = ["derive"] }
static_assertions = "1"

[dev-dependencies]
serde = { version = "1", default-features = false }
static_assertions = "1"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "mvp_vault"
harness = false
required-features = ["std"]

[features]
default = []
std = ["getrandom"]
replay-scaffold = ["std"]
zero-persistence = ["std"]
sovereign-hardened = ["zero-persistence"]
pqc = ["ml-kem"]
suite_guomi = ["sm3"]
suite_korea = []
# Gate the Plonky3 FRI-STARK verifier backend. The `plonky3` crate itself is
# NOT yet a dependency (supply-chain vetting required). This feature compiles
# the interface design, profile-lock tests, and Domain B containment harness.
# Add `plonky3 = { version = "...", ... }` to [dependencies] once vetted.
plonky3 = []
