[package]
name = "qash-pal"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
path = "src/root.rs"

[dependencies]
qash-consensus = { path = "../consensus", version = "0.1.0" }
hmac-drbg = "0.3.0"
sha2 = "0.9"
sha3 = { workspace = true }
ml-kem = { version = "0.3", optional = true }
getrandom = { version = "0.2", optional = true }
typenum = "1.20.0"

[dev-dependencies]
serde = { workspace = true }
static_assertions = "1"

[features]
default = []
std = ["getrandom"]
replay-scaffold = ["std"]
zero-persistence = ["std"]
sovereign-hardened = ["zero-persistence"]
pqc = ["ml-kem"]