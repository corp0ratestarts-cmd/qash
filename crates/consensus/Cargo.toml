[package]
name = "qash-consensus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
sha3 = { version = "0.10.8", default-features = false }

[dev-dependencies]
sha3 = { version = "0.10.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
