[package]
name = "qash-consensus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
sha3 = { version = "0.10.8", default-features = false }

[dev-dependencies]
sha3 = { version = "0.10.8", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []
