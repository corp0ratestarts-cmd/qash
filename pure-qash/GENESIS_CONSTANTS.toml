# Pure QASH Genesis Constants
# Status: PROVISIONAL — not network-canonical until genesis-candidate PR merged.
# Modifying this file defines a new network. Treat as append-only post-genesis.

[meta]
version            = "0.1.0"
profile            = "pure-qash-core-v1"
genesis_status     = "provisional"
deployment_authoritative = false

# ── Fixed-point arithmetic ─────────────────────────────────────────────────────
[fixed_point]
scale              = 1_000_000          # All scalar values are elements of 𝔽_p
intermediate_width = "i128"
rounding           = "floor"
overflow_policy    = "absorbing_halt"

# ── Lyapunov convergence weights ──────────────────────────────────────────────
[lyapunov]
weight_divergence  = 400_000
weight_conflict    = 350_000
weight_slash       = 250_000
epsilon            = 20_000
phi_max_safe       = 500_000_000
window_size        = 3

# ── Epoch timing ──────────────────────────────────────────────────────────────
[epoch.timing]
duration_ms             = 500
max_control_loop_latency_ms = 450
sync_tolerance_ms       = 50
epoch_skew_bound        = 1

# ── Economics — Constitutional Scarcity Axiom ─────────────────────────────────
[economics]
monetary_policy         = "qash-constitutional-scarcity-v1"

# Issuance (all values in atomic units; no floating-point)
initial_reward_atomic   = 1_000_000_000
decay_interval_epochs   = 10_512_000      # ~60 months at 500ms/epoch
tail_reward_atomic      = 10_000          # Fixed nominal floor; never falls below

# Burn policy — "total" means 100%; no BPS arithmetic required
fee_burn_policy         = "total"
slash_burn_policy       = "total"

# Feature flags — all false; absence guards enforce these
priority_fees_enabled           = false
fee_overpayment_allowed         = false
validator_fee_revenue_enabled   = false
monetary_governance_enabled     = false
oracle_supply_inputs_enabled    = false
discretionary_treasury_enabled  = false
regulated_disclosure_enabled    = false

# ── Cryptographic cascade (same primitive set as umbrella) ────────────────────
[crypto.cascade]
primary_signature   = "Dilithium5"
anchor_signature    = "SLH-DSA-SHA3-256"
fallback_signature  = "Falcon-512"
hash_primitives     = ["SHA3-256", "BLAKE3", "KangarooTwelve", "SM3-256",
                       "Streebog-512", "Kupyna-512", "LSH-512"]
pqc_agility_epoch   = 10_000

[crypto.transport]
kem_primary         = "X-Wing"
kem_classical       = "X25519"
kem_pqc             = "ML-KEM-768"
combiner            = "SHA3-256"

# ── Obfuscation / leaf indices ─────────────────────────────────────────────────
[obfuscation]
leaf_index_bytes    = 48
sparse_merkle_depth = 384

# ── Cascade health ────────────────────────────────────────────────────────────
[cascade.health]
depth               = 8
threshold           = 8
compatibility_window = 100
health_factor       = 50_000

# ── Hardware authorisation ────────────────────────────────────────────────────
[hardware]
authorized_isas     = ["x86_64", "aarch64", "riscv64gc", "loongarch64"]
attestation_modes   = ["TPM2", "TrustZone", "SecureEnclave", "software"]

# ── Genesis entropy sources ───────────────────────────────────────────────────
[genesis.entropy]
sources             = ["drand", "NIST-Beacon"]
combiner            = "SHA3-512"

# ── PTX fee constants (provisional; covered by tests) ─────────────────────────
[fee]
base_ptx0_atomic    = 1_000             # Base fee for PTX-0 (Pure cash transfer)
per_byte_atomic     = 10                # Per-byte resource cost
