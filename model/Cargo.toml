[package]
name = "qash-model"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Canonical reference execution layer — bridge between Coq proofs and production runtime"

[dependencies]
qash-consensus = { path = "../crates/consensus", version = "0.1.0" }

[features]
default = []
# Enable std-based test helpers (e.g. println!, panic! with message).
# The model is no_std + alloc by default.
std = []
