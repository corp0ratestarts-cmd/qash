# Gitleaks configuration for the QASH repository.
# Extends the default ruleset with allowlists for known-safe cryptographic
# constants that would otherwise trigger high-entropy false positives.

title = "QASH gitleaks config"

[extend]
# Inherit all default gitleaks rules.
useDefault = true

# Global allowlist — applies to every rule.
# genesis_hash in GENESIS_CONSTANTS.toml is a public 512-bit cascade hash
# (128 lowercase hex chars), not a secret. KAT vectors are known-answer test
# outputs. All entries here are protocol constants committed intentionally.
[allowlist]
description = "Public cryptographic constants: genesis hash, cascade KAT vectors"
paths = [
  '''GENESIS_CONSTANTS\.toml''',
  '''tests/vectors/cascade_kat\.json''',
  '''tests/vectors/vectors\.v[0-9].*\.json''',
  # ACVP-style CAVP KAT fixture files — all values are public test vectors,
  # not real credentials. Keys/MACs are NIST/RFC standard known-answer values.
  '''tests/cavp/.*\.json''',
  # Rust test files containing hardcoded KAT hex constants
  '''crates/.*/(drbg|kem|hash|post)\.rs''',
  # CAVP fixture integrity test — contains NIST SHA3-256 and HMAC-SHA-256
  # known-answer vectors as string literals for cross-checking the JSON fixtures.
  '''crates/pal/tests/cavp_json_vectors\.rs''',
  # Reproducible build manifest — contains SHA-256 hashes of build artifacts,
  # not credentials.
  '''artifacts/build/build-manifest\.md''',
  # Test vectors hash registry — SHA-256 digests of test vector files.
  '''tests/vectors/vector-hashes\.txt''',
  # Pre-genesis evidence snapshot — documentation-only prose describing protocol
  # features (e.g. 'disclosure key', 'epoch-scoped') with no real key material.
  '''docs/release/pre_genesis_evidence_snapshot\.md''',
]
regexes = [
  # genesis_hash field — QASH-CASCADE-7 or SHA3-256 prefixed public hash
  '''genesis_hash\s*=\s*"[A-Z0-9_-]+:[0-9a-fA-F<>A-Z_:]+"''',
  # cascade KAT hex fields in JSON
  '''"h_cascade(?:_keyed)?_hex"\s*:\s*"[0-9a-fA-F]+"''',
  '''"context_key_hex"\s*:\s*"[0-9a-fA-F]+"''',
  '''"input_hex"\s*:\s*"[0-9a-fA-F]*"''',
]
