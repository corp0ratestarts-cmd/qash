# Gitleaks configuration for the QASH repository.
# Extends the default ruleset with allowlists for known-safe cryptographic
# constants that would otherwise trigger high-entropy false positives.

title = "QASH gitleaks config"

[extend]
# Inherit all default gitleaks rules.
useDefault = true

[[allowlists]]
description = "Genesis hash and protocol constants in GENESIS_CONSTANTS.toml are public cryptographic commitments, not secrets"
paths = [
  '''GENESIS_CONSTANTS\.toml''',
]

[[allowlists]]
description = "Cascade KAT vectors in tests are known-answer test outputs, not secrets"
paths = [
  '''tests/vectors/cascade_kat\.json''',
  '''tests/vectors/vectors\.v.*\.json''',
]

[[allowlists]]
description = "genesis_hash field contains a public 512-bit cascade hash, not a key"
regexes = [
  '''genesis_hash\s*=\s*"QASH-CASCADE-7:[0-9a-fA-F]+"''',
  '''genesis_hash\s*=\s*"SHA3-256:[0-9a-fA-F]+"''',
  '''"h_cascade_hex"\s*:\s*"[0-9a-fA-F]+"''',
  '''"h_cascade_keyed_hex"\s*:\s*"[0-9a-fA-F]+"''',
]
