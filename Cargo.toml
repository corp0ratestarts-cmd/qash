[package]
name = "qash"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]
members = [
  "crates/consensus",
  "crates/pal",
  "crates/address",
  "model",
]

[dependencies]
qash-consensus = { path = "crates/consensus", version = "0.1.0" }
qash-pal       = { path = "crates/pal",       version = "0.1.0", features = ["std"] }
qash-model     = { path = "model",            version = "0.1.0" }
qash-address   = { path = "crates/address",   version = "0.1.0" }
argon2         = "0.5"
getrandom      = "0.2"
sha3           = "0.11"

[[bin]]
name = "genesis-hash"
path = "src/bin/genesis_hash.rs"

[[bin]]
name = "genesis-cert"
path = "src/bin/genesis_cert.rs"

[features]
# Hardware attestation backends (scaffold — require platform-specific hardware).
# Each is explicitly not claimed for v1.0; activate only when real hardware is available.
tpm2    = []   # TPM 2.0 backend via tss-esapi; requires tpm2-tools and a TPM device.
tdx     = []   # Intel TDX backend; requires Intel TDX-capable CPU and kernel support.
sev-snp = []   # AMD SEV-SNP backend; requires AMD EPYC with SEV-SNP and Linux 5.19+.
arm-cca = []   # ARM CCA / Realm Management Monitor; requires ARMv9 CCA hardware.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug-assertions = true
strip = true
