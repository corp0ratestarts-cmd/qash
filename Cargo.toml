[package]
name = "qash"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]
members = [
  "crates/consensus",
  "crates/pal",
  "tests/vector-runner",
]

[dependencies]
qash-consensus = { path = "crates/consensus" }
qash-pal = { path = "crates/pal" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug-assertions = true
strip = true
