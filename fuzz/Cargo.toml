[package]
name = "qash-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace — excluded from the root workspace.
# cargo-fuzz requires nightly + LLVM sanitizer flags; keep it isolated
# so the main workspace stays on stable.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
qash-consensus = { path = "../crates/consensus", default-features = false }

[[bin]]
name = "cascade_fuzz"
path = "fuzz_targets/cascade_fuzz.rs"
test = false
doc = false

[[bin]]
name = "decode_fuzz"
path = "fuzz_targets/decode_fuzz.rs"
test = false
doc = false

[[bin]]
name = "transition_fuzz"
path = "fuzz_targets/transition_fuzz.rs"
test = false
doc = false
