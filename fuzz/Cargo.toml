[package]
name = "qash-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone workspace — excluded from the root workspace.
# honggfuzz works with stable Rust; no nightly or LLVM required.
[workspace]

[dependencies]
honggfuzz = "0.5"
arbitrary = { version = "1", features = ["derive"] }
qash-consensus = { path = "../crates/consensus", default-features = false }
qash-pal = { path = "../crates/pal", features = ["std"] }

[[bin]]
name = "encoding_fuzz"
path = "fuzz_targets/encoding_fuzz.rs"
test = false
doc = false

[[bin]]
name = "cascade_fuzz"
path = "fuzz_targets/cascade_fuzz.rs"
test = false
doc = false

[[bin]]
name = "decode_fuzz"
path = "fuzz_targets/decode_fuzz.rs"
test = false
doc = false

[[bin]]
name = "transition_fuzz"
path = "fuzz_targets/transition_fuzz.rs"
test = false
doc = false

[[bin]]
name = "fixed_point_fuzz"
path = "fuzz_targets/fixed_point_fuzz.rs"
test = false
doc = false

[[bin]]
name = "lyapunov_fuzz"
path = "fuzz_targets/lyapunov_fuzz.rs"
test = false
doc = false

[[bin]]
name = "tx_fuzz"
path = "fuzz_targets/tx_fuzz.rs"
test = false
doc = false

[[bin]]
name = "boundary_fuzz"
path = "fuzz_targets/boundary_fuzz.rs"
test = false
doc = false

[[bin]]
name = "wal_decode"
path = "fuzz_targets/wal_decode.rs"
test = false
doc = false
